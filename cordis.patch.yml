# One row per package. The Client half (./client -> lib/client.cjs) is attached
# automatically from package.json's `dsh.client`; adding a second `dsh-md-live/client`
# row would make two Loader sources resolve to the same package name, which the
# client module system rejects.
- insert:
    - id: md-live
      name: 'dsh-md-live'
